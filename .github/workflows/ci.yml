name: CI

on:
  push:
    # Pull requests are covered by the branch-push check.

  # Merge queue runs always do a full build (no diff range is computed for them).
  merge_group:
  schedule:
    - cron: "19 2 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Keep this as ONE always-running job and mark it as the required check.
  # Skipping happens at the step level, so docs-only changes still report
  # success instead of leaving a required check pending forever.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so we can diff against github.event.before on pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          mode=full     # full | affected | skip
          tasks=""

          # Compute a diff range only where it is reliable. Every other case
          # (schedule, workflow_dispatch, merge_group, new branch, force push,
          # missing parent commit) stays on the safe default: full.
          range=()
          if [ "$EVENT" = "pull_request" ] \
            && git rev-parse --verify -q 'HEAD^1' >/dev/null; then
            range=(HEAD^1 HEAD)
          elif [ "$EVENT" = "push" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE" "$AFTER")
          fi

          if [ ${#range[@]} -gt 0 ]; then
            count=0
            docs=0
            force_full=false
            domain_changed=false
            android_app_changed=false

            while IFS= read -r -d '' path; do
              count=$((count + 1))

              case "$path" in
                *.md|docs/*|LICENSE|LICENSE.*) docs=$((docs + 1)); continue ;;
              esac

              # Build-wide changes affect every module and every bounded context.
              case "$path" in
                build.gradle*|settings.gradle*|gradle.properties|gradle/*|buildSrc/*|build-logic/*|gradlew|gradlew.bat|.github/*)
                  force_full=true ;;
              esac

              # Bounded contexts are source packages inside :shared, not Gradle
              # modules. Anything unrecognized falls through to a full build.
              case "$path" in
                shared/src/*/kotlin/com/jdrms/bulletin/domain/home/* \
                | shared/src/*/kotlin/com/jdrms/bulletin/domain/marketplace/* \
                | shared/src/*/kotlin/com/jdrms/bulletin/domain/listings/* \
                | shared/src/*/kotlin/com/jdrms/bulletin/domain/messages/* \
                | shared/src/*/kotlin/com/jdrms/bulletin/domain/profile/*)
                  domain_changed=true ;;
                androidApp/*)
                  android_app_changed=true ;;
                shared/*)
                  force_full=true ;;
                *)
                  force_full=true ;; # root-level or unknown path: fail safe
              esac
            done < <(git diff -z --name-only --no-renames "${range[@]}")

            if [ "$count" -eq 0 ]; then
              mode=full                       # empty/failed diff: fail safe
            elif [ "$count" -eq "$docs" ]; then
              mode=skip                       # docs only
            elif [ "$force_full" = "true" ]; then
              mode=full
            else
              mode=affected
              # Domain aggregates can be consumed across contexts, so any
              # domain change runs every domain test package, plus app/core
              # tests that cover composition and shared infrastructure.
              if [ "$domain_changed" = "true" ]; then
                tasks="$tasks :shared:compileAndroidMain :shared:testAndroidHostTest"
                for domain in home marketplace listings messages profile; do
                  tasks="$tasks --tests com.jdrms.bulletin.domain.${domain}.*"
                done
                tasks="$tasks --tests com.jdrms.bulletin.app.* --tests com.jdrms.bulletin.core.*"
              fi

              if [ "$android_app_changed" = "true" ]; then
                tasks="$tasks :androidApp:check"
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

          {
            echo "**Scope:** \`$mode\`"
            if [ -n "$tasks" ]; then
              echo "**Tasks:** \`$tasks\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        if: steps.scope.outputs.mode != 'skip'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: steps.scope.outputs.mode != 'skip'
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Check file length and size suppressions
        if: steps.scope.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          # Size-rule suppressions (must return nothing)
          if command -v rg >/dev/null 2>&1; then
            if rg -n '@Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "Error: Forbidden size-rule suppressions found!" >&2
              exit 1
            fi
          else
            if grep -rnE '@Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "Error: Forbidden size-rule suppressions found!" >&2
              exit 1
            fi
          fi

          # Any Kotlin file over 400 lines (must only list known legacy files)
          known_legacy=(
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/home/presentation/HomeScreen.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModel.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceDetailBottomSheet.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/infrastructure/repository/SupabaseProfileRepositories.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileEditContent.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileDomainTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileInfrastructureTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileViewModelTest.kt"
          )

          oversized=$(find shared/src -name '*.kt' -print0 | xargs -0 wc -l | awk '$1 > 400 && $2 != "total" {print $2}')
          for file in $oversized; do
            found=false
            for legacy in "${known_legacy[@]}"; do
              if [ "$file" = "$legacy" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = "false" ]; then
              echo "Error: $file is over 400 lines and not in known legacy files!" >&2
              exit 1
            fi
          done

      - name: Run Gradle (full)
        if: steps.scope.outputs.mode == 'full'
        run: ./gradlew check --stacktrace --continue --console=plain

      - name: Run Gradle (affected domains/modules)
        if: steps.scope.outputs.mode == 'affected'
        env:
          TASKS: ${{ steps.scope.outputs.tasks }}
        run: |
          set -euo pipefail
          # Keep Gradle's --tests patterns literal instead of allowing shell
          # pathname expansion to alter them.
          set -f
          read -r -a gradle_tasks <<< "$TASKS"
          ./gradlew "${gradle_tasks[@]}" --stacktrace --continue --console=plain

      - name: Upload build reports
        if: failure() && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

name: CI

on:
  push:
    # Branch pushes cover PR branches; tags are excluded.
    branches: ["**"]
  merge_group:
  schedule:
    - cron: "19 2 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep in sync with the full-tests matrix.
  TEST_SHARD_COUNT: "4"

jobs:
  scope:
    name: Decide scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      domains: ${{ steps.scope.outputs.domains }}
      domain_changed: ${{ steps.scope.outputs.domain_changed }}
      android_app_changed: ${{ steps.scope.outputs.android_app_changed }}
      admin_changed: ${{ steps.scope.outputs.admin_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
          # Set true to test all five domains on any domain change.
          ALL_DOMAINS_ON_ANY_CHANGE: "false"
        run: |
          set -euo pipefail
          ALL_DOMAINS="home marketplace listings messages profile"
          mode=full
          range=()
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            base=$(git merge-base origin/main "$AFTER" 2>/dev/null || true)
            if [ -n "$base" ]; then range=("$base" "$AFTER"); fi
          fi
          changed=""
          domain_changed=false
          android_app_changed=false
          admin_changed=false
          if [ ${#range[@]} -gt 0 ]; then
            count=0
            docs=0
            force_full=false
            # Materialize the diff first: process-substitution errors must not be lost.
            git diff -z --name-only --no-renames "${range[@]}" > "$RUNNER_TEMP/ci-paths"
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                *.md|docs/*|LICENSE|LICENSE.*) docs=$((docs + 1)); continue ;;
              esac
              case "$path" in
                shared/src/*/kotlin/com/jdrms/bulletin/domain/*/*)
                  d="${path#*/domain/}"; d="${d%%/*}"
                  case "$d" in
                    home|marketplace|listings|messages|profile)
                      changed="$changed $d"; domain_changed=true ;;
                    *) force_full=true ;;
                  esac ;;
                androidApp/*) android_app_changed=true ;;
                admin/*) admin_changed=true ;;
                *) force_full=true ;; # Build configuration, shared code, or unknown paths.
              esac
            done < "$RUNNER_TEMP/ci-paths"
            if [ "$count" -eq 0 ]; then mode=full
            elif [ "$count" -eq "$docs" ]; then mode=skip
            elif [ "$force_full" = true ]; then mode=full
            else mode=affected
            fi
          fi
          selected=""
          if [ "$mode" = affected ] && [ "$domain_changed" = true ]; then
            for d in $ALL_DOMAINS; do
              if [ "$ALL_DOMAINS_ON_ANY_CHANGE" = true ] || [[ " $changed " == *" $d "* ]]; then
                selected="$selected $d"
              fi
            done
          fi
          # Domain names are a fixed allowlist; split them into jq arguments.
          # shellcheck disable=SC2086
          domains_json=$(jq -cn '$ARGS.positional' --args $selected)
          {
            echo "mode=$mode"
            echo "domains=$domains_json"
            echo "domain_changed=$domain_changed"
            echo "android_app_changed=$android_app_changed"
            echo "admin_changed=$admin_changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "**Scope:** \`$mode\`"
            echo "**Domains:** \`$domains_json\`"
            echo "**Domain tree changed:** $domain_changed"
            echo "**androidApp changed:** $android_app_changed"
            echo "**admin changed:** $admin_changed"
          } >> "$GITHUB_STEP_SUMMARY"

  size-check:
    name: File length and size suppressions
    needs: scope
    if: needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check file length and size suppressions
        run: |
          set -euo pipefail

          # Size-rule suppressions (must return nothing)
          if command -v rg >/dev/null 2>&1; then
            if rg -n '@(file:)?Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "Error: Forbidden size-rule suppressions found!" >&2
              exit 1
            fi
          else
            if grep -rnE '@(file:)?Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "Error: Forbidden size-rule suppressions found!" >&2
              exit 1
            fi
          fi

          # Any Kotlin file over 400 lines (must only list known legacy files)
          known_legacy=(
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/home/presentation/HomeScreen.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModel.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceDetailBottomSheet.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/infrastructure/repository/SupabaseProfileRepositories.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileEditContent.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileDomainTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileInfrastructureTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileViewModelTest.kt"
          )

          oversized=$(find shared/src -name '*.kt' -print0 | xargs -0 -r wc -l | awk '$1 > 400 && $2 != "total" {print $2}')
          for file in $oversized; do
            found=false
            for legacy in "${known_legacy[@]}"; do
              if [ "$file" = "$legacy" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = "false" ]; then
              echo "Error: $file is over 400 lines and not in known legacy files!" >&2
              exit 1
            fi
          done

  # check retains Android app tests, lint and detekt; host tests run separately.
  static:
    name: Static analysis
    needs: scope
    if: >-
      needs.scope.outputs.mode == 'full' ||
      (needs.scope.outputs.mode == 'affected' &&
       (needs.scope.outputs.domain_changed == 'true' ||
        needs.scope.outputs.android_app_changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run check without shared host tests
        run: ./gradlew check -x :shared:testAndroidHostTest --stacktrace --continue --console=plain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-static
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  full-tests:
    name: Full tests (shard ${{ matrix.index }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          ./gradlew :shared:testAndroidHostTest \
            -PtestShardCount="$TEST_SHARD_COUNT" \
            -PtestShardIndex="$SHARD_INDEX" \
            --stacktrace --continue --console=plain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-full-shard-${{ matrix.index }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  domain-tests:
    name: Domain tests (${{ matrix.domain }})
    needs: scope
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.domains != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.scope.outputs.domains) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run domain tests
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          ./gradlew :shared:compileAndroidMain :shared:testAndroidHostTest \
            --tests "com.jdrms.bulletin.domain.${DOMAIN}.*" \
            --stacktrace --continue --console=plain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-domain-${{ matrix.domain }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  shared-tests:
    name: App and core tests
    needs: scope
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.domain_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run app and core tests
        # HomeDomainBoundaryTest guards only Home and runs in its domain job.
        run: |
          ./gradlew :shared:compileAndroidMain :shared:testAndroidHostTest \
            --tests "com.jdrms.bulletin.app.*" \
            --tests "com.jdrms.bulletin.core.*" \
            --stacktrace --continue --console=plain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-app-core
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  admin:
    name: Admin tests
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.admin_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: admin/requirements.txt
      - name: Install portal dependencies
        run: python -m pip install -r requirements.txt
      - name: Test authentication and moderation
        run: python -B -m unittest discover -s tests -v

  # Keep this required-check name stable. Failed or cancelled dependencies fail it.
  build:
    name: Build and Test
    needs: [scope, size-check, static, full-tests, domain-tests, shared-tests, admin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: $RESULTS"
          test "$SCOPE_RESULT" = success
          case "$RESULTS" in
            *failure*|*cancelled*) echo "One or more required jobs failed." >&2; exit 1 ;;
          esac

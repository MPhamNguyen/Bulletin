name: Build & Test

on:
  push:
    branches: ["main", "ci"]

  pull_request:
    branches: ["main", "ci"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect Changed Paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'config/**'
              - '.github/workflows/**'
              - 'shared/build.gradle.kts'
              - 'shared/src/commonMain/kotlin/com/jdrms/bulletin/core/**'
              - 'shared/src/commonMain/kotlin/com/jdrms/bulletin/app/**'
              - 'shared/src/commonMain/kotlin/com/jdrms/bulletin/App.kt'
              - 'shared/src/commonMain/composeResources/**'
              - 'shared/src/androidMain/**'
              - 'shared/src/androidHostTest/**'
              - 'shared/src/commonTest/kotlin/com/jdrms/bulletin/GreetingTest.kt'
            home:
              - 'shared/src/**/domain/home/**'
            marketplace:
              - 'shared/src/**/domain/marketplace/**'
            listings:
              - 'shared/src/**/domain/listings/**'
            messages:
              - 'shared/src/**/domain/messages/**'
            profile:
              - 'shared/src/**/domain/profile/**'
            androidApp:
              - 'androidApp/**'

      - name: Run Build and Tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.global }}" = "true" ]; then
            echo "Running full build and check (pull request, manual trigger, or global/core changes)..."
            ./gradlew check --no-daemon
          else
            GRADLE_TASKS=()
            TEST_FILTERS=()

            if [ "${{ steps.filter.outputs.home }}" = "true" ]; then
              echo "Changes detected in Home domain"
              TEST_FILTERS+=(--tests "com.jdrms.bulletin.domain.home.*")
            fi

            if [ "${{ steps.filter.outputs.marketplace }}" = "true" ]; then
              echo "Changes detected in Marketplace domain"
              TEST_FILTERS+=(--tests "com.jdrms.bulletin.domain.marketplace.*")
            fi

            if [ "${{ steps.filter.outputs.listings }}" = "true" ]; then
              echo "Changes detected in Listings domain"
              TEST_FILTERS+=(--tests "com.jdrms.bulletin.domain.listings.*")
            fi

            if [ "${{ steps.filter.outputs.messages }}" = "true" ]; then
              echo "Changes detected in Messages domain"
              TEST_FILTERS+=(--tests "com.jdrms.bulletin.domain.messages.*")
            fi

            if [ "${{ steps.filter.outputs.profile }}" = "true" ]; then
              echo "Changes detected in Profile domain"
              TEST_FILTERS+=(--tests "com.jdrms.bulletin.domain.profile.*")
            fi

            if [ ${#TEST_FILTERS[@]} -gt 0 ]; then
              GRADLE_TASKS+=(:shared:compileAndroidMain :shared:testAndroidHostTest "${TEST_FILTERS[@]}")
            fi

            if [ "${{ steps.filter.outputs.androidApp }}" = "true" ]; then
              echo "Changes detected in Android App module"
              GRADLE_TASKS+=(:androidApp:check)
            fi

            if [ ${#GRADLE_TASKS[@]} -gt 0 ]; then
              echo "Running targeted build tasks: ${GRADLE_TASKS[*]}"
              ./gradlew "${GRADLE_TASKS[@]}" --no-daemon
            else
              echo "No application code changes detected on push. Skipping build."
            fi
          fi

name: CI

run-name: "CI · ${{ github.event_name == 'merge_group' && 'merge queue' || github.event_name == 'schedule' && 'weekly full run' || github.event_name == 'workflow_dispatch' && 'manual run' || github.ref_name }}"

on:
  push:
    # Branch pushes cover PR branches; tags are excluded.
    branches: ["**"]
  merge_group:
  schedule:
    - cron: "19 2 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TEST_SHARD_COUNT: "4"

jobs:
  scope:
    name: "🔎 Decide scope"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      domains: ${{ steps.scope.outputs.domains }}
      domain_changed: ${{ steps.scope.outputs.domain_changed }}
      android_app_changed: ${{ steps.scope.outputs.android_app_changed }}
      admin_changed: ${{ steps.scope.outputs.admin_changed }}
      shard_indices: ${{ steps.scope.outputs.shard_indices }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
          # Set true to test all six domains on any domain change.
          ALL_DOMAINS_ON_ANY_CHANGE: "false"
        run: |
          set -euo pipefail
          [[ "$TEST_SHARD_COUNT" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error title=CI configuration::TEST_SHARD_COUNT must be a positive integer"
            exit 1
          }
          ALL_DOMAINS="home marketplace listings messages profile reporting"
          mode=full
          reason="no diff range for $EVENT on ${REF#refs/heads/}, so running everything (safe default)"
          range=()
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            base=$(git merge-base origin/main "$AFTER" 2>/dev/null || true)
            if [ -n "$base" ]; then range=("$base" "$AFTER"); fi
          fi
          changed=""
          domain_changed=false
          android_app_changed=false
          admin_changed=false
          full_reason=""
          if [ ${#range[@]} -gt 0 ]; then
            count=0
            docs=0
            force_full=false
            # Materialize the diff first: process-substitution errors must not be lost.
            git diff -z --name-only --no-renames "${range[@]}" > "$RUNNER_TEMP/ci-paths"
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                *.md|docs/*|LICENSE|LICENSE.*) docs=$((docs + 1)); continue ;;
              esac
              case "$path" in
                shared/src/*/kotlin/com/jdrms/bulletin/domain/*/*)
                  d="${path#*/domain/}"; d="${d%%/*}"
                  case "$d" in
                    home|marketplace|listings|messages|profile|reporting)
                      changed="$changed $d"; domain_changed=true ;;
                    *)
                      force_full=true
                      : "${full_reason:=unrecognized domain package: $path}" ;;
                  esac ;;
                androidApp/*) android_app_changed=true ;;
                admin/*) admin_changed=true ;;
                build.gradle*|settings.gradle*|gradle.properties|gradle/*|buildSrc/*|build-logic/*|gradlew|gradlew.bat|.github/*)
                  force_full=true
                  : "${full_reason:=build-wide file changed: $path}" ;;
                shared/*)
                  force_full=true
                  : "${full_reason:=shared code outside the domain packages: $path}" ;;
                *)
                  force_full=true
                  : "${full_reason:=unrecognized path: $path}" ;;
              esac
            done < "$RUNNER_TEMP/ci-paths"
            if [ "$count" -eq 0 ]; then
              mode=full
              reason="empty diff against main, so running everything (safe default)"
            elif [ "$count" -eq "$docs" ]; then
              mode=skip
              reason="only docs changed ($count files)"
            elif [ "$force_full" = true ]; then
              mode=full
              reason="$full_reason"
            else
              mode=affected
              reason="$count files changed against main; running only what they touch"
            fi
          fi
          selected=""
          if [ "$mode" = affected ] && [ "$domain_changed" = true ]; then
            for d in $ALL_DOMAINS; do
              if [ "$ALL_DOMAINS_ON_ANY_CHANGE" = true ] || [[ " $changed " == *" $d "* ]]; then
                selected="$selected $d"
              fi
            done
          fi
          # Domain names are a fixed allowlist; split them into jq arguments.
          # shellcheck disable=SC2086
          domains_json=$(jq -cn '$ARGS.positional' --args $selected)
          {
            echo "mode=$mode"
            echo "domains=$domains_json"
            echo "domain_changed=$domain_changed"
            echo "android_app_changed=$android_app_changed"
            echo "admin_changed=$admin_changed"
            echo "shard_indices=$(jq -cn --argjson count "$TEST_SHARD_COUNT" '[range(0; $count)]')"
          } >> "$GITHUB_OUTPUT"
          flag() { if [ "$1" = true ]; then echo "✏️ changed"; else echo "—"; fi; }
          runs="size rules"
          case "$mode" in
            full)
              icon="🟥"
              runs="$runs, static analysis, $TEST_SHARD_COUNT test shards, admin tests" ;;
            affected)
              icon="🟨"
              if [ "$domain_changed" = true ]; then
                domains="${selected# }"
                runs="$runs, static analysis, domain tests (${domains// /, }), app & core tests"
              elif [ "$android_app_changed" = true ]; then
                runs="$runs, static analysis"
              fi
              if [ "$admin_changed" = true ]; then runs="$runs, admin tests"; fi ;;
            skip) icon="🟩"; runs="nothing" ;;
          esac
          {
            echo "### $icon Scope: \`$mode\`"
            echo
            echo "_${reason}_"
            echo
            echo "**Will run:** $runs"
            echo
            echo "| Area | Status |"
            echo "| --- | --- |"
            echo "| 🧩 Domain packages | $(flag "$domain_changed") |"
            echo "| 📱 androidApp | $(flag "$android_app_changed") |"
            echo "| 🐍 admin | $(flag "$admin_changed") |"
          } >> "$GITHUB_STEP_SUMMARY"

  size-check:
    name: "📏 Size rules"
    needs: scope
    if: needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check file length and size suppressions
        run: |
          set -euo pipefail

          # Size-rule suppressions (must return nothing)
          if command -v rg >/dev/null 2>&1; then
            if rg -n '@(file:)?Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "::error title=Size rules::Forbidden size-rule suppressions found (see log)"
              exit 1
            fi
          else
            if grep -rnE '@(file:)?Suppress\(.*(LargeClass|LongParameterList|TooManyFunctions|LongMethod)' shared/src androidApp/src; then
              echo "::error title=Size rules::Forbidden size-rule suppressions found (see log)"
              exit 1
            fi
          fi

          # Any Kotlin file over 400 lines (must only list known legacy files)
          known_legacy=(
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/home/presentation/HomeScreen.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModel.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceDetailBottomSheet.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/infrastructure/repository/SupabaseProfileRepositories.kt"
            "shared/src/commonMain/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileEditContent.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/listings/presentation/ListingsViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/marketplace/presentation/MarketplaceViewModelTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileDomainTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/ProfileInfrastructureTest.kt"
            "shared/src/commonTest/kotlin/com/jdrms/bulletin/domain/profile/presentation/ProfileViewModelTest.kt"
          )

          failed=false
          oversized=$(find shared/src -name '*.kt' -print0 | xargs -0 -r wc -l | awk '$1 > 400 && $2 != "total" {print $2}')
          for file in $oversized; do
            found=false
            for legacy in "${known_legacy[@]}"; do
              if [ "$file" = "$legacy" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = "false" ]; then
              echo "::error file=$file,title=File too long::Over 400 lines and not in the known-legacy list"
              failed=true
            fi
          done
          [ "$failed" = false ]

  design-system:
    name: "🎨 Design-system boundaries"
    needs: scope
    if: needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the boundary check itself
        run: scripts/test-check-design-system-boundaries.sh
      - name: Reject raw components and literals outside core/designsystem
        run: scripts/check-design-system-boundaries.sh

  # check retains Android app tests, lint and detekt; host tests run separately.
  static:
    name: "🧹 Static analysis"
    needs: scope
    if: >-
      needs.scope.outputs.mode == 'full' ||
      (needs.scope.outputs.mode == 'affected' &&
       (needs.scope.outputs.domain_changed == 'true' ||
        needs.scope.outputs.android_app_changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run check without shared host tests
        run: ./gradlew check -x :shared:testAndroidHostTest --stacktrace --continue --console=plain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-static
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  full-tests:
    name: "🧪 Full tests"
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.scope.outputs.shard_indices) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run test shard ${{ matrix.shard_index }}
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          ./gradlew :shared:testAndroidHostTest \
            -PtestShardCount="$TEST_SHARD_COUNT" \
            -PtestShardIndex="$SHARD_INDEX" \
            --stacktrace --continue --console=plain
      - name: Summarize test results
        id: summary
        if: always()
        uses: ./.github/actions/test-summary
        with:
          title: Shard ${{ matrix.shard_index }}
      - name: Record shard test count
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          TEST_COUNT: ${{ steps.summary.outputs.test_count }}
        run: echo "$SHARD_INDEX $TEST_COUNT" > "shard-count-$SHARD_INDEX.txt"
      - name: Upload shard test count
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-test-count-${{ matrix.shard_index }}
          path: shard-count-${{ matrix.shard_index }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-full-shard-${{ strategy.job-index }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  domain-tests:
    name: "🧩 Domain tests"
    needs: scope
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.domains != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.scope.outputs.domains) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run domain tests
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          ./gradlew :shared:compileAndroidMain :shared:testAndroidHostTest \
            --tests "com.jdrms.bulletin.domain.${DOMAIN}.*" \
            --stacktrace --continue --console=plain
      - name: Summarize test results
        if: always()
        uses: ./.github/actions/test-summary
        with:
          title: ${{ matrix.domain }} domain
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-domain-${{ matrix.domain }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  shared-tests:
    name: "🧱 App & core tests"
    needs: scope
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.domain_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-gradle
      - name: Run app and core tests
        # HomeDomainBoundaryTest guards only Home and runs in its domain job.
        run: |
          ./gradlew :shared:compileAndroidMain :shared:testAndroidHostTest \
            --tests "com.jdrms.bulletin.app.*" \
            --tests "com.jdrms.bulletin.core.*" \
            --stacktrace --continue --console=plain
      - name: Summarize test results
        if: always()
        uses: ./.github/actions/test-summary
        with:
          title: App & core
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-app-core
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  admin:
    name: "🐍 Admin tests"
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.admin_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: admin/requirements.txt
      - name: Install portal dependencies
        run: python -m pip install -r requirements.txt
      - name: Test authentication and moderation
        run: python -B -m unittest discover -s tests -v

  # Keep this required-check name stable. Failed or cancelled dependencies fail it.
  build:
    name: Build and Test
    needs: [scope, size-check, design-system, static, full-tests, domain-tests, shared-tests, admin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          {
            echo "### 🚦 Gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS_JSON" | jq -r '
              def icon: {"success":"✅","failure":"❌","cancelled":"🚫","skipped":"⏭️"}[.] // "❔";
              to_entries[] | "| \(.key) | \(.value.result | icon) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download shard test counts
        if: needs.scope.outputs.mode == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-test-count-*
          path: shard-counts
          merge-multiple: true

      - name: Verify every shard ran tests
        if: needs.scope.outputs.mode == 'full'
        env:
          EXPECTED_SHARDS: ${{ needs.scope.outputs.shard_indices }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          expected = set(json.loads(os.environ["EXPECTED_SHARDS"]))
          reports = list(Path("shard-counts").glob("shard-count-*.txt"))
          observed = {}
          for report in reports:
              try:
                  index_text, count_text = report.read_text(encoding="utf-8").split()
                  index, count = int(index_text), int(count_text)
              except (OSError, ValueError):
                  print(f"Invalid shard count report: {report}", file=sys.stderr)
                  raise SystemExit(1)
              if index in observed:
                  print(f"Duplicate report for shard {index}", file=sys.stderr)
                  raise SystemExit(1)
              observed[index] = count

          missing = expected - observed.keys()
          unexpected = observed.keys() - expected
          empty = sorted(index for index, count in observed.items() if count <= 0)
          if missing or unexpected or empty:
              print(
                  f"Shard coverage invalid: missing={sorted(missing)}, "
                  f"unexpected={sorted(unexpected)}, empty={empty}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"Verified {len(expected)} shards and {sum(observed.values())} total tests.")
          PY

      - name: Evaluate results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: $RESULTS"
          test "$SCOPE_RESULT" = success
          case "$RESULTS" in
            *failure*|*cancelled*) echo "::error title=Gate::One or more required jobs failed."; exit 1 ;;
          esac
name: Remove stale branches

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  remove-stale-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Find stale branches
        uses: fpicalausa/remove-stale-branches@v2.6.1
        with:
          dry-run: false

          days-before-branch-stale: 7
          days-before-branch-delete: 7

          ignore-branches-with-open-prs: true

          exempt-protected-branches: true
          exempt-branches-regex: "^(main|master)$"
name: Remove stale branches

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  remove-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Find stale branches
        uses: fpicalausa/remove-stale-branches@9b829bc2975ade0c61e64e9613def53ec0732440 # v2.6.1
        with:
          dry-run: false
          days-before-branch-stale: 14
          days-before-branch-delete: 14

          ignore-branches-with-open-prs: true

          exempt-protected-branches: true
          exempt-branches-regex: "^(main|master)$"

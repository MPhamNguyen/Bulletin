# Detekt configuration for Bulletin (detekt 1.23.x schema).
# Runs on top of detekt's default rules (buildUponDefaultConfig = true),
# so this file only lists overrides. The `formatting` ruleset is provided by
# the detekt-formatting plugin, which wraps ktlint and is driven by .editorconfig.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LargeClass:
    active: true
    threshold: 300
    excludes:
      - '**/ListingsViewModelTest.kt'
  TooManyFunctions:
    active: true
    thresholdInClasses: 15
    thresholdInFiles: 15
    ignoreOverridden: true
  LongParameterList:
    active: true
    constructorThreshold: 9
    functionThreshold: 8
    ignoreDefaultParameters: false
  LongMethod:
    active: true
    threshold: 40
    # @Composable screen functions are declaratively long by nature.
    ignoreAnnotated: ["Composable"]
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  NestedBlockDepth:
    active: true
    threshold: 4

style:
  ForbiddenSuppress:
    active: true
    rules:
      - 'LargeClass'
      - 'LongParameterList'
      - 'TooManyFunctions'
      - 'LongMethod'
      - 'CyclomaticComplexMethod'
  ForbiddenComment:
    # This is an in-progress skeleton; TODO/FIXME markers are expected scaffolding.
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 4
  WildcardImport:
    # Compose code relies on wildcard imports; keep them allowed.
    active: false

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ["Composable"]
  MatchingDeclarationName:
    # KMP expect/actual files (Platform.android.kt) and grouping files
    # (AppNavigation.kt holding AppDestination) intentionally break this.
    active: false
  PackageNaming:
    active: false

formatting:
  active: true
  android: true
  autoCorrect: true
  PackageName:
    active: false
  FunctionName:
    active: false
  Filename:
    active: false
  NoWildcardImports:
    active: false

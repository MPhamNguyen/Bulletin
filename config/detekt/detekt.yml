# Detekt configuration for Bulletin (detekt 1.23.x schema).
# Runs on top of detekt's default rules (buildUponDefaultConfig = true),
# so this file only lists overrides. The `formatting` ruleset is provided by
# the detekt-formatting plugin, which wraps ktlint and is driven by .editorconfig.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    # @Composable screen functions are declaratively long by nature.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    # DI use-case constructors and ViewModels legitimately take several deps.
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false

style:
  ForbiddenComment:
    # This is an in-progress skeleton; TODO/FIXME markers are expected scaffolding.
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 4
  WildcardImport:
    # Compose code relies on wildcard imports; keep them allowed.
    active: false

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # KMP expect/actual files (Platform.android.kt) and grouping files
    # (AppNavigation.kt holding AppDestination) intentionally break this.
    active: false

formatting:
  active: true
  android: true
  autoCorrect: true
  FunctionName:
    active: false
  Filename:
    active: false
  NoWildcardImports:
    active: false

<label class="mb-1.5 block text-xs font-semibold text-slate-700 dark:text-slate-200" for="action">Account action</label>
<select class="mb-3 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900" name="action" id="action" required>
  <option value="">Choose an action</option>
  {% for value, label in account_actions.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
</select>
<fieldset class="mb-3 rounded-xl border border-slate-200 dark:border-slate-700 p-3" id="suspension-duration" hidden disabled>
  <legend class="px-1 text-xs font-semibold text-slate-700 dark:text-slate-200">How long should the suspension last?</legend>
  <label class="mb-1.5 block text-xs font-semibold text-slate-700 dark:text-slate-200" for="duration">Duration</label>
  <input class="mb-3 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900" type="number" name="duration" id="duration" min="1" max="365" step="1" inputmode="numeric" required aria-describedby="duration-help">
  <label class="mb-1.5 block text-xs font-semibold text-slate-700 dark:text-slate-200" for="duration-unit">Unit</label>
  <select class="mb-3 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900" name="duration_unit" id="duration-unit" required>
    <option value="days">Days</option>
    <option value="hours">Hours</option>
    <option value="minutes">Minutes</option>
  </select>
  <p class="text-xs leading-relaxed text-muted" id="duration-help">Enter a whole number. Maximum suspension: 365 days. The duration starts when this action is applied.</p>
</fieldset>
<noscript><p class="mb-3 rounded-lg bg-amber-50 dark:bg-amber-950/40 p-3 text-xs text-amber-900 dark:text-amber-200">Enable JavaScript to enter a suspension duration. Restoring access works without JavaScript.</p></noscript>
<p class="mb-3 text-xs text-muted">Restore removes the account suspension. These actions do not delete listings.</p>
<label class="mb-1.5 block text-xs font-semibold text-slate-700 dark:text-slate-200" for="account-action-comment">Comment (optional)</label>
<textarea class="mb-3 min-h-24 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900" id="account-action-comment" name="comment" maxlength="4000" rows="3" placeholder="Explain this account action"></textarea>
<label class="my-4 flex items-start gap-2 text-sm font-normal"><input class="mt-1 size-4 accent-primary" type="checkbox" name="confirm" value="yes" required> I confirm this action applies to this account.</label>
<button class="rounded-lg bg-primary dark:bg-blue-800 px-4 py-2.5 text-sm font-bold text-white hover:bg-primary-dark dark:hover:bg-blue-700" type="submit">Apply account action</button>
